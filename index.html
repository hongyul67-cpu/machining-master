<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기계공작법·절삭가공</title>
<!-- 수업용 「모두 같은 문제」 — 다른 공용 스크립트보다 먼저 -->
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --tx:#1c2430; --dim:#6b7684;
    --pri:#2563eb; --ok:#12a150; --no:#e5484d; --warn:#f5a524;
    --steel:#64748b; --chip:#f1f5f9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.65 "Pretendard","맑은 고딕",system-ui,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:16px 14px 96px}

  header{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .sub{color:var(--dim);font-size:13px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);
       cursor:pointer;font-weight:700;font-size:14px;color:var(--dim)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .card .body{color:#333}
  .kw{background:#eef4ff;color:#1d4ed8;border-radius:6px;padding:1px 6px;font-weight:700}
  .fm{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;
      margin:8px 0;font-weight:700;text-align:center;letter-spacing:.2px}
  .card ul{margin:8px 0 0;padding-left:20px}
  .card li{margin:3px 0}
  .fig{margin:10px 0;text-align:center}
  .fig svg{max-width:100%;width:520px;height:auto}
  .fig.small svg{width:280px}
  .figcap{color:var(--dim);font-size:12px;margin-top:4px}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;
       padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .qnum{color:var(--dim);font-size:13px;font-weight:700}
  .qtext{font-size:17px;font-weight:700;margin:6px 0 12px;line-height:1.5}
  .choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
          border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px}
  .choice:hover{border-color:var(--pri)}
  .choice.correct{border-color:var(--ok);background:#eafaf1}
  .choice.wrong{border-color:var(--no);background:#fdeeee}
  .choice.picked{border-width:2px}
  .explain{background:#f8fafc;border-left:3px solid var(--pri);border-radius:0 8px 8px 0;
           padding:10px 14px;margin-top:10px;color:#334}
  .progress{height:8px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin:10px 0 16px}
  .progress > i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}

  .empty{color:var(--dim);text-align:center;padding:34px 10px}
  .score{font-size:34px;font-weight:900;letter-spacing:-1px}
  .muted{color:var(--dim);font-size:13px}
  .pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:2px 10px;
        font-size:12px;font-weight:700;color:var(--dim)}

  /* 단원 고르기 */
  .units{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .unitbtn{padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);
           cursor:pointer;font-size:13px;font-weight:700;color:var(--dim)}
  .unitbtn.on{background:#1c2430;border-color:#1c2430;color:#fff}

  /* 게임 */
  .gmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
         cursor:pointer;text-align:left}
  .gcard:hover{border-color:var(--pri)}
  .gcard .ge{font-size:26px}
  .gcard h4{margin:6px 0 4px;font-size:15px}
  .gcard p{margin:0;color:var(--dim);font-size:13px;line-height:1.5}
  .hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .hud .box{background:var(--card);border:1px solid var(--line);border-radius:10px;
            padding:6px 12px;font-weight:800;font-size:14px}
  .combo{color:var(--warn)}
  .numin{border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:17px;
         font-weight:800;width:150px;text-align:right;font-family:inherit}
  .tiles{display:flex;gap:8px;flex-wrap:wrap}
  .tile{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;
        cursor:pointer;font-weight:700;font-size:14px}
  .tile:hover{border-color:var(--pri)}
  .tile.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .tile.done{opacity:.35;cursor:default}
  .slot{border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;min-height:44px;
        background:#fbfcfd;font-size:14px}
  .slot.filled{border-style:solid;background:var(--card);font-weight:700}
  .gq{font-size:17px;font-weight:700;margin:4px 0 12px;line-height:1.5}
  table.wheel{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  table.wheel th,table.wheel td{border:1px solid var(--line);padding:7px 9px;text-align:left}
  table.wheel th{background:#f8fafc;width:34%;font-size:13px;color:var(--dim)}
  .mono{font-family:"Consolas","D2Coding",monospace;font-weight:800;letter-spacing:2px;font-size:20px}

  /* 수업 슬라이드가 열려 있는 동안 남는 떠 있는 위젯을 가린다.
     뒤로 · 기록 초기화 · 계급 배지 · 평가 기준(#rb-btn)은 공용 board-pro.js 가 가린다.
     이 도구가 따로 쓰는 소리(#fxSnd)만 여기서 가린다. */
  body.bp-open #fxSnd{visibility:hidden!important;pointer-events:none!important}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>기계공작법·절삭가공</h1>
    <span class="sub" id="hdSub"></span>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="learn">📖 배우기</button>
    <button class="tab"    data-view="game">🎮 게임</button>
    <button class="tab"    data-view="practice">✏️ 연습 8문항</button>
    <button class="tab"    data-view="exam">🏁 종합시험 20문항</button>
    <button class="tab"    data-view="wrong">📕 오답노트</button>
    <button class="tab boardbtn" type="button" onclick="openBoardPro()">📽️ 수업 슬라이드 열기</button>
  </div>

  <div id="view"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   기계공작법·절삭가공 마스터
   규약: https://github.com/hongyul67-cpu/links/blob/master/CONVENTIONS.md

   근거 자료 — 한국산업인력공단 훈련교재 「기계공작법」·「기계제작법」
   (공공누리 제4유형: 출처표시 + 상업적 이용금지 + 변경금지).
   교재 본문과 그림은 옮기지 않았고, 개념을 바탕으로 문장과 그림을 새로 썼습니다.
   ══════════════════════════════════════════════════════════════ */

/* ── 1) 배우기 — 정답을 다 보여 주는 단계. 테스트보다 반드시 앞에 ── */
const LEARN = [

/* ───────── 1단원 기계공작법 개론 ───────── */
{ unit:'1. 개론', t:'기계공작법이란', body:
  '재료를 깎거나 눌러서 <span class="kw">쓸모 있는 부품 모양</span>으로 만드는 방법 전체를 기계공작법이라 한다. 크게 둘로 나뉜다.' +
  '<ul>' +
  '<li><b>절삭가공</b> — 공구와 가공물이 상대운동을 하며 <span class="kw">칩(chip)</span>을 만들어 필요 없는 부분을 떼어 낸다. 선삭·밀링·드릴링·연삭 등</li>' +
  '<li><b>비절삭가공</b> — 칩을 내지 않고 모양을 만든다. 주조·단조·압연·인발·프레스·용접 등</li>' +
  '</ul>' +
  '<b>칩이 나오는가</b> 하나로 갈린다고 기억하면 쉽다.' },

{ unit:'1. 개론', t:'금속의 성질과 가공법은 짝을 이룬다', body:
  '어떤 가공법을 쓸 수 있는지는 그 금속이 가진 성질이 정한다.' +
  '<ul>' +
  '<li><span class="kw">주조성</span>(가융성) → 주조 · 용접</li>' +
  '<li><span class="kw">전연성</span>(가소성) → 단조 · 압연 · 인발 · 압출 · 프레스</li>' +
  '<li><span class="kw">접합성</span> → 용접 · 단접 · 압접 · 납땜</li>' +
  '<li><span class="kw">절삭성</span> → 선삭 · 형삭 · 평삭 · 브로칭 · 밀링 · 드릴링 · 보링</li>' +
  '<li><span class="kw">연삭성</span> → 연삭 · 호닝 · 슈퍼피니싱 · 래핑</li>' +
  '</ul>' },

{ unit:'1. 개론', t:'공작기계의 구비 조건', body:
  '공작기계가 갖추어야 할 조건이다.' +
  '<ul>' +
  '<li>높은 <b>정밀도</b>를 가질 것</li>' +
  '<li><b>가공 능력</b>이 클 것</li>' +
  '<li><b>강성</b>이 크고 사용이 간편할 것</li>' +
  '<li>고장이 적고 <b>기계 효율</b>이 좋을 것</li>' +
  '<li>가격이 싸고 운전 비용이 저렴할 것</li>' +
  '</ul>' },

{ unit:'1. 개론', t:'가공 능률에 따른 공작기계 분류', body:
  '<ul>' +
  '<li><b>범용</b> 공작기계 — 여러 가지 작업을 두루 할 수 있다. 보통의 선반 · 밀링</li>' +
  '<li><b>전용</b> 공작기계 — 한 제품만 대량으로 만들도록 전용화한 기계</li>' +
  '<li><b>단능</b> 공작기계 — 한 가지 작업만 하는 기계. 센터링 머신 등</li>' +
  '<li><b>만능</b> 공작기계 — 선반 · 밀링 · 드릴링 등 여러 기능을 한 대에 모은 기계</li>' +
  '</ul>' +
  '「전용」과 「단능」이 헷갈린다. <b>전용은 제품이 하나</b>, <b>단능은 작업이 하나</b>다.' },

{ unit:'1. 개론', t:'공작기계의 기본 운동 3가지', body:
  '<ul>' +
  '<li><b>절삭 운동</b> — 실제로 칩을 깎아 내는 운동</li>' +
  '<li><b>이송 운동</b> — 공구나 가공물을 조금씩 보내 주어 절삭이 이어지게 하는 운동</li>' +
  '<li><b>위치 조정 운동</b> — 깎기 전에 공구와 가공물의 자리를 잡는 운동</li>' +
  '</ul>' +
  '위치 조정 운동은 <b>칩을 깎지 않는다.</b> 준비 동작이다.' },

/* ───────── 2단원 절삭 이론 ───────── */
{ unit:'2. 절삭 이론', t:'절삭 저항의 3분력', body:
  '공구가 재료를 깎을 때 공구는 세 방향에서 힘을 받는다.' +
  '<div class="fig"><svg viewBox="0 0 420 200" role="img" aria-label="절삭 저항 3분력 방향">' +
  '<defs>' +
  '<marker id="ar1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e5484d"/></marker>' +
  '<marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>' +
  '<marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#12a150"/></marker>' +
  '</defs>' +
  '<rect x="20" y="120" width="250" height="62" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>' +
  '<text x="140" y="158" text-anchor="middle" font-size="13" fill="#475569">가공물</text>' +
  '<path d="M270 120 L322 88 L352 108 L300 140 Z" fill="#64748b"/>' +
  '<text x="356" y="132" font-size="12" fill="#475569">바이트</text>' +
  '<line x1="283" y1="118" x2="283" y2="46" stroke="#e5484d" stroke-width="3" marker-end="url(#ar1)"/>' +
  '<text x="290" y="54" font-size="13" font-weight="700" fill="#e5484d">주분력</text>' +
  '<line x1="283" y1="118" x2="176" y2="118" stroke="#2563eb" stroke-width="3" marker-end="url(#ar2)"/>' +
  '<text x="168" y="110" font-size="13" font-weight="700" fill="#2563eb" text-anchor="end">이송분력</text>' +
  '<line x1="283" y1="118" x2="368" y2="152" stroke="#12a150" stroke-width="3" marker-end="url(#ar3)"/>' +
  '<text x="360" y="176" font-size="13" font-weight="700" fill="#12a150" text-anchor="middle">배분력</text>' +
  '</svg><div class="figcap">절삭 저항이 작용하는 세 방향</div></div>' +
  '<ul>' +
  '<li><b>주분력</b> — 절삭 방향과 나란한 힘. 셋 중 <span class="kw">가장 크다</span></li>' +
  '<li><b>배분력</b> — 공구 축 방향과 나란한 힘</li>' +
  '<li><b>이송분력</b> — 이송 방향과 나란한 힘</li>' +
  '</ul>' +
  '크기 순서는 <span class="kw">주분력 &gt; 배분력 &gt; 이송분력</span> 이다. 합성하면' +
  '<div class="fm">P = √( 주분력² + 이송분력² + 배분력² )</div>' },

{ unit:'2. 절삭 이론', t:'절삭 속도와 회전수', body:
  '지름 D(mm)인 가공물이 N(rpm)으로 돌 때, 날 끝이 지나가는 속도가 절삭 속도 V(m/min)다.' +
  '<div class="fm">V = π D N ÷ 1000　(m/min)</div>' +
  '원하는 절삭 속도가 정해져 있으면 회전수를 거꾸로 구한다.' +
  '<div class="fm">N = 1000 V ÷ (π D)　(rpm)</div>' +
  'D 는 <b>mm</b>, V 는 <b>m/min</b> 이다. 1000 으로 나누는 이유가 이 단위 차이다. ' +
  '지름이 <b>커지면</b> 같은 회전수라도 절삭 속도는 <b>빨라진다.</b>' },

{ unit:'2. 절삭 이론', t:'선반의 가공 시간', body:
  '길이 L(mm)을 이송 f(mm/rev)로, N(rpm)으로 깎을 때 걸리는 시간이다.' +
  '<div class="fm">T = L ÷ ( f × N )　(min)</div>' +
  '한 바퀴에 f 만큼 나아가므로 1분에 f×N (mm)을 간다. 길이를 그 속도로 나눈 것이다. ' +
  '깎는 횟수(패스)가 i 번이면 <b>T × i</b> 가 된다.' },

{ unit:'2. 절삭 이론', t:'밀링의 이송 속도', body:
  '밀링은 커터에 날이 여러 개 달려 있어서 <b>날 수</b>가 식에 들어간다.' +
  '<div class="fm">f = f<sub>z</sub> × z × N　(mm/min)</div>' +
  '<ul>' +
  '<li><b>f<sub>z</sub></b> — 날 하나당 이송량(mm)</li>' +
  '<li><b>z</b> — 커터의 날 수</li>' +
  '<li><b>N</b> — 커터의 회전수(rpm)</li>' +
  '</ul>' +
  '선반은 「한 바퀴당」(mm/rev), 밀링은 「1분당」(mm/min)으로 이송을 말한다. 단위가 다르다.' },

{ unit:'2. 절삭 이론', t:'가공 변질층', body:
  '깎인 자리의 표면은 속(모재)과 조직이 다르다. 절삭할 때 눌리고 늘어나면서 ' +
  '<span class="kw">섬유 조직</span> · <span class="kw">가공 경화</span> · <span class="kw">잔류 응력</span>이 생기기 때문이다. ' +
  '이 표피층을 <b>가공 변질층</b>이라 한다. 정밀 부품에서는 이 층을 래핑 · 호닝 같은 뒷가공으로 걷어 낸다.' },

/* ───────── 3단원 칩과 구성인선 ───────── */
{ unit:'3. 칩·구성인선', t:'칩의 4가지 형태', body:
  '깎여 나온 칩의 모양을 보면 절삭이 잘 되고 있는지 알 수 있다.' +
  '<div class="fig"><svg viewBox="0 0 460 132" role="img" aria-label="칩의 네 가지 형태 모양 비교">' +
  '<g stroke="#64748b" fill="none" stroke-width="2.5" stroke-linecap="round">' +
  '<path d="M20 100 q18 -55 46 -60 q22 -4 26 18 q3 20 -18 24"/>' +
  '<path d="M140 100 l10 -22 l12 8 l10 -22 l12 8 l10 -22 l12 8"/>' +
  '<path d="M262 100 l14 -30 l14 12 l14 -30 l14 12"/>' +
  '<path d="M372 100 l16 -18 M394 96 l14 -20 M416 92 l12 -18"/>' +
  '</g>' +
  '<g font-size="12" fill="#475569" text-anchor="middle">' +
  '<text x="58" y="124">유동형</text><text x="180" y="124">전단형</text>' +
  '<text x="300" y="124">경작형(열단형)</text><text x="404" y="124">균열형</text></g>' +
  '</svg><div class="figcap">왼쪽으로 갈수록 좋은 절삭 상태</div></div>' +
  '<ul>' +
  '<li><b>유동형</b> — 끊기지 않고 매끄럽게 흘러나온다. <span class="kw">가장 바람직한 칩</span></li>' +
  '<li><b>전단형</b> — 일정 간격으로 미끄러지며 끊어진다</li>' +
  '<li><b>경작형(열단형)</b> — 공구가 재료를 파고들며 뜯어낸다. 가공면이 거칠다</li>' +
  '<li><b>균열형</b> — 툭툭 부서진다. <span class="kw">주철처럼 메진 재료</span>에서 나온다</li>' +
  '</ul>' },

{ unit:'3. 칩·구성인선', t:'유동형 칩이 나오는 조건', body:
  '<ul>' +
  '<li>연강 · 구리 · 알루미늄처럼 <b>연성</b>이 큰 재료일 때</li>' +
  '<li>절삭 깊이가 <b>얕을</b> 때</li>' +
  '<li>절삭 속도가 <b>빠를</b> 때</li>' +
  '<li>경사각이 <b>클</b> 때</li>' +
  '<li>윤활성이 좋은 절삭제를 쓸 때</li>' +
  '</ul>' +
  '뒤에 나오는 <b>구성인선 방지 대책</b>과 조건이 거의 같다. 좋은 절삭 조건은 한 방향으로 모인다.' },

{ unit:'3. 칩·구성인선', t:'구성인선', body:
  '점성이 큰 재료를 <b>저속</b>으로 깎으면, 칩의 일부가 공구 날 끝에 눌러붙어 굳는다. ' +
  '이것이 마치 새 날처럼 행세하는 것을 <span class="kw">구성인선</span>이라 한다. ' +
  '가공면을 거칠게 하고 치수를 틀어지게 하므로 없애야 한다.' +
  '<div class="fm">발생 → 성장 → 최대 성장(분열) → 탈락　… 이 과정을 반복</div>' +
  '1주기에 걸리는 시간은 <b>1/100 ~ 1/300초</b> 정도로 매우 짧다. ' +
  '떨어져 나갈 때 <b>공구 날 끝을 함께 뜯어 가</b> 공구를 상하게 한다.' },

{ unit:'3. 칩·구성인선', t:'구성인선 방지 대책 5가지', body:
  '<ul>' +
  '<li>절삭 <b>깊이를 얕게</b> 한다</li>' +
  '<li><b>경사각을 크게</b> 한다</li>' +
  '<li>공구 <b>인선을 예리하게</b> 한다</li>' +
  '<li>윤활성이 좋은 <b>절삭제</b>를 쓴다</li>' +
  '<li>절삭 <b>속도를 크게</b> 한다</li>' +
  '</ul>' +
  '구성인선은 <b>저속</b>에서 생긴다. 그래서 속도를 <b>올리는</b> 것이 대책이다. ' +
  '「속도를 낮춘다」로 잘못 외우기 쉬우니 주의한다.' },

{ unit:'3. 칩·구성인선', t:'버(burr)와 디버링', body:
  '깎고 난 모서리에 남는 <span class="kw">거스러미</span>가 버(burr)다. 손을 베이고 조립을 방해하므로 제거한다. ' +
  '이 제거 작업이 <b>디버링</b>이며, 배럴(연마제) 방식 · 화학 디버링 · 초음파 디버링 · 자기 연마 방식 등이 있다.' },

/* ───────── 4단원 공구 마모와 수명 ───────── */
{ unit:'4. 공구 수명', t:'공구 마모의 4가지 형태', body:
  '<div class="fig"><svg viewBox="0 0 400 150" role="img" aria-label="크레이터 마모와 플랭크 마모가 생기는 자리">' +
  '<path d="M40 112 L40 48 L152 112 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>' +
  '<path d="M58 70 q20 12 30 26" stroke="#e5484d" stroke-width="5" fill="none" stroke-linecap="round"/>' +
  '<text x="96" y="42" font-size="12" fill="#e5484d" font-weight="700" text-anchor="middle">크레이터 마모</text>' +
  '<text x="96" y="134" font-size="12" fill="#475569" text-anchor="middle">경사면이 패인다</text>' +
  '<path d="M248 112 L248 48 L360 112 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>' +
  '<rect x="248" y="100" width="30" height="12" fill="#e5484d"/>' +
  '<text x="304" y="42" font-size="12" fill="#e5484d" font-weight="700" text-anchor="middle">플랭크 마모</text>' +
  '<text x="304" y="134" font-size="12" fill="#475569" text-anchor="middle">여유면이 닳는다</text>' +
  '</svg></div>' +
  '<ul>' +
  '<li><b>크레이터 마모</b> — 칩이 흐르는 <b>경사면</b>이 움푹 패인다</li>' +
  '<li><b>플랭크 마모</b> — 가공면에 닿는 <b>여유면</b>이 평평하게 닳는다</li>' +
  '<li><b>치핑</b> — 날 끝이 <b>깨져</b> 떨어진다</li>' +
  '<li><b>온도 파손</b> — 절삭열로 날이 물러져 무너진다</li>' +
  '</ul>' },

{ unit:'4. 공구 수명', t:'테일러의 공구 수명식', body:
  '절삭 속도가 빠를수록 공구는 빨리 죽는다. 그 관계를 나타낸 식이다.' +
  '<div class="fm">V T <sup>n</sup> = C</div>' +
  '<ul>' +
  '<li><b>V</b> — 절삭 속도(m/min)</li>' +
  '<li><b>T</b> — 공구 수명(min)</li>' +
  '<li><b>n</b> — 공구와 가공물에 따라 정해지는 지수</li>' +
  '<li><b>C</b> — 공구 수명 상수</li>' +
  '</ul>' +
  '공구 수명은 <b>분(min) 단위의 실제 절삭 시간</b>으로 나타낸다. ' +
  '공구를 갈아 끼우거나 재연삭할 때까지 실제로 깎은 시간의 합이다.' },

{ unit:'4. 공구 수명', t:'공구 수명을 다했다고 판정하는 방법', body:
  '<ul>' +
  '<li>가공면에 <b>광택 있는 색조나 반점</b>이 생길 때</li>' +
  '<li>공구 인선의 <b>마모량이 일정량</b>에 도달했을 때</li>' +
  '<li>완성 <b>치수의 변화량</b>이 일정량에 도달했을 때</li>' +
  '<li>주분력은 별로 안 변해도 <b>이송분력과 배분력이 급격히 증가</b>할 때</li>' +
  '<li>주분력이 처음보다 <b>일정량 증가</b>했을 때</li>' +
  '</ul>' +
  '「이송분력 · 배분력이 먼저 튄다」가 핵심이다. 주분력만 보고 있으면 놓친다.' },

/* ───────── 5단원 절삭유제와 윤활 ───────── */
{ unit:'5. 절삭유제', t:'절삭제의 3대 작용', body:
  '<ul>' +
  '<li><b>냉각 작용</b> — 절삭열을 식힌다</li>' +
  '<li><b>윤활 작용</b> — 공구와 칩 사이 마찰을 줄인다</li>' +
  '<li><b>세척 작용</b> — 칩을 씻어 낸다</li>' +
  '</ul>' +
  '이 셋 덕분에 <b>절삭 성능이 좋아지고 공구 수명이 길어진다.</b> 그것이 절삭제를 쓰는 목적이다.' },

{ unit:'5. 절삭유제', t:'윤활 방법과 급유 방법', body:
  '<b>윤활 방법</b> — 기름막이 어떻게 버티느냐로 나눈다.' +
  '<ul>' +
  '<li><b>유체 윤활</b> — 기름막이 두 면을 완전히 갈라 놓은 상태. 가장 좋다</li>' +
  '<li><b>경계 윤활</b> — 기름막이 얇아 부분적으로 금속이 닿는 상태</li>' +
  '<li><b>극압 윤활</b> — 압력이 매우 높아 극압 첨가제가 화학 피막을 만드는 상태</li>' +
  '</ul>' +
  '<b>급유 방법</b> — 핸드 급유 · 적하 급유 · 오일링 급유 · 오일 미스트 · 강제 급유 · 유욕 급유 · 그리스 윤활' },

/* ───────── 6단원 절삭공구 재료 ───────── */
{ unit:'6. 공구 재료', t:'절삭공구 재료의 구비 조건', body:
  '<ul>' +
  '<li>가공 재료보다 <b>경도가 클 것</b></li>' +
  '<li><b>고온에서도 경도가 떨어지지 않을 것</b> (고온 경도)</li>' +
  '<li><b>인성</b>과 <b>내마모성</b>이 클 것</li>' +
  '<li>공구로 <b>제작하기 쉬울 것</b></li>' +
  '<li>가격이 저렴할 것</li>' +
  '</ul>' +
  '경도만 크면 되는 것이 아니다. <b>고온에서 버티는가</b>가 실제 절삭에서는 더 중요하다.' },

{ unit:'6. 공구 재료', t:'공구 재료의 종류 — 무른 것에서 단단한 것으로', body:
  '<ul>' +
  '<li><b>탄소공구강(STC)</b> — 값싸지만 낮은 온도에서 벌써 물러진다. 저속 전용</li>' +
  '<li><b>고속도강(HSS)</b> — 대표 조성이 <span class="kw">18-4-1</span>, 즉 <b>W 18% · Cr 4% · V 1%</b></li>' +
  '<li><b>주조 경질 합금</b> — 대표가 <span class="kw">스텔라이트</span>. 850℃까지 경도가 유지되고, <b>단조와 열처리가 되지 않는다</b></li>' +
  '<li><b>초경합금</b> — 탄화물 분말을 소결한 것. 고온 경도가 매우 높다</li>' +
  '<li><b>세라믹</b> — <span class="kw">산화알루미늄(Al₂O₃)</span> 분말이 주성분. 초경합금보다 빠르게 깎을 수 있고 매우 가볍지만 <b>인성이 약해</b> 충격에 약하다</li>' +
  '<li><b>CBN</b> — 자연계에 없는 인공 합성 재료. 초고온 · 초고압으로 소결해 만든다</li>' +
  '<li><b>다이아몬드</b> — 가장 단단하다</li>' +
  '</ul>' +
  '<b>18-4-1</b> 은 시험 단골이다. 텅스텐 18, 크롬 4, 바나듐 1.' },

{ unit:'6. 공구 재료', t:'다이아몬드 공구의 성질', body:
  '<ul>' +
  '<li>경도가 매우 크다</li>' +
  '<li>열팽창이 적다 — 강의 12% 정도</li>' +
  '<li>열전도율이 크다</li>' +
  '<li>금속에 대한 <b>마찰계수와 마모율이 작다</b></li>' +
  '<li>장시간 고속 절삭이 가능하고 <b>표면 거칠기가 매우 우수</b>하다</li>' +
  '<li>다만 <b>날 끝이 손상되면 재가공이 어렵다</b></li>' +
  '<li>공기 중에서 815℃로 가열하면 변질된다</li>' +
  '</ul>' },

/* ───────── 7단원 선반 ───────── */
{ unit:'7. 선반', t:'선반의 4대 주요부', body:
  '<div class="fig"><svg viewBox="0 0 460 170" role="img" aria-label="선반의 주요부 배치">' +
  '<rect x="24" y="122" width="412" height="26" rx="3" fill="#cbd5e1" stroke="#94a3b8"/>' +
  '<text x="230" y="140" text-anchor="middle" font-size="12" fill="#475569" font-weight="700">베드</text>' +
  '<rect x="30" y="52" width="86" height="70" rx="4" fill="#94a3b8" stroke="#475569"/>' +
  '<text x="73" y="92" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">주축대</text>' +
  '<rect x="116" y="76" width="18" height="26" fill="#64748b"/>' +
  '<rect x="150" y="80" width="150" height="20" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>' +
  '<text x="225" y="95" text-anchor="middle" font-size="11" fill="#475569">가공물</text>' +
  '<rect x="196" y="102" width="66" height="20" rx="3" fill="#64748b"/>' +
  '<text x="229" y="117" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">왕복대</text>' +
  '<rect x="318" y="60" width="94" height="62" rx="4" fill="#94a3b8" stroke="#475569"/>' +
  '<text x="365" y="96" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">심압대</text>' +
  '<line x1="300" y1="90" x2="318" y2="90" stroke="#475569" stroke-width="3"/>' +
  '<text x="229" y="42" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">← 센터 간 최대 거리 →</text>' +
  '</svg></div>' +
  '<ul>' +
  '<li><b>주축대</b> — 가공물을 물고 돌린다. 척이 여기 붙는다</li>' +
  '<li><b>왕복대</b> — 바이트를 싣고 좌우로 움직인다</li>' +
  '<li><b>심압대</b> — 반대쪽 끝을 센터로 받쳐 준다</li>' +
  '<li><b>베드</b> — 위 셋을 모두 올려놓는 바닥. 산형(미식) · 평형(영식) · 절충식이 있다</li>' +
  '</ul>' +
  '왕복대는 다시 베드 <b>위쪽</b>의 <b>새들</b>과 베드 <b>아래쪽</b>의 <b>에이프런</b>으로 나뉜다.' },

{ unit:'7. 선반', t:'선반의 크기를 나타내는 방법', body:
  '<ul>' +
  '<li><b>스윙</b> — 깎을 수 있는 가공물의 <b>최대 지름</b>. 베드 위 스윙과 왕복대 위 스윙으로 나눠 적는다</li>' +
  '<li><b>양 센터 사이의 최대 거리</b> — 깎을 수 있는 <b>최대 길이</b></li>' +
  '</ul>' +
  '「스윙 × 센터 간 거리」로 적는다. 스윙은 <b>반지름이 아니라 지름</b>이다.' },

{ unit:'7. 선반', t:'선반의 종류', body:
  '<ul>' +
  '<li><b>보통선반</b> — 가장 널리 쓰는 기본형</li>' +
  '<li><b>정면선반</b> — 지름이 크고 길이가 짧은 원판 모양 가공물의 <b>정면</b>을 깎는다</li>' +
  '<li><b>수직선반</b> — 주축이 수직이다. 무겁고 큰 가공물을 올려놓기 편하다</li>' +
  '<li><b>터릿선반</b> — 여러 공구를 터릿에 꽂아 차례로 돌려 쓴다. 같은 부품을 많이 만들 때</li>' +
  '<li><b>공구선반</b> — 정밀한 공구를 만드는 데 쓰는 선반</li>' +
  '<li><b>탁상선반</b> — 작은 부품용으로 작업대 위에 올려놓는다</li>' +
  '</ul>' },

{ unit:'7. 선반', t:'바이트의 각도', body:
  '<div class="fig"><svg viewBox="0 0 400 170" role="img" aria-label="바이트의 경사각과 여유각">' +
  '<rect x="30" y="120" width="220" height="34" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>' +
  '<text x="120" y="142" font-size="12" fill="#475569">가공물</text>' +
  '<path d="M250 120 L250 46 L330 46 L330 96 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>' +
  '<line x1="250" y1="46" x2="250" y2="26" stroke="#94a3b8" stroke-dasharray="4 3"/>' +
  '<line x1="250" y1="120" x2="216" y2="120" stroke="#94a3b8" stroke-dasharray="4 3"/>' +
  '<path d="M250 66 A 20 20 0 0 1 264 52" fill="none" stroke="#2563eb" stroke-width="2"/>' +
  '<text x="272" y="40" font-size="12" fill="#2563eb" font-weight="700">경사각</text>' +
  '<path d="M232 120 A 18 18 0 0 0 244 108" fill="none" stroke="#12a150" stroke-width="2"/>' +
  '<text x="196" y="104" font-size="12" fill="#12a150" font-weight="700">여유각</text>' +
  '</svg></div>' +
  '<ul>' +
  '<li><b>경사각(rake angle)</b> — 칩이 흘러나가는 윗면의 기울기. <b>크면</b> 칩이 잘 흐르고 절삭 저항이 줄지만, 날이 얇아져 <b>약해진다</b></li>' +
  '<li><b>여유각(clearance angle)</b> — 공구와 가공면이 <b>스치지 않게</b> 비워 둔 각. 없으면 여유면이 가공면에 문질러진다</li>' +
  '</ul>' +
  '경사각을 크게 하는 것은 <b>구성인선 방지 대책</b>이기도 하다.' },

{ unit:'7. 선반', t:'센터와 부속품', body:
  '<ul>' +
  '<li><b>센터</b> — 가공물의 끝을 받친다. 센터 각도는 보통 <span class="kw">60°</span>이고, 대형은 75°, 더 크면 90°를 쓴다</li>' +
  '<li><b>맨드릴(심봉)</b> — <b>구멍이 이미 뚫린</b> 가공물을 끼워 바깥지름을 깎을 때 쓴다</li>' +
  '<li><b>방진구</b> — <b>가늘고 긴</b> 가공물이 휘거나 떨리지 않게 받쳐 준다. 새들에 붙는 이동식은 조가 2개다</li>' +
  '<li><b>돌리개와 면판</b> — 센터 작업에서 가공물에 회전을 전달한다</li>' +
  '</ul>' +
  '<b>척의 종류</b> — 단동척(조가 따로 움직여 정밀), 연동척(조가 함께 움직여 빠름), ' +
  '만능척(=복동척, 단동과 연동을 겸함), 마그네틱척, 공기척과 유압척' },

{ unit:'7. 선반', t:'테이퍼 깎는 방법', body:
  '<ul>' +
  '<li><b>복식 공구대를 경사</b>시키는 방법 — 짧고 각도가 큰 테이퍼</li>' +
  '<li><b>심압대를 편위</b>시키는 방법 — 길고 완만한 테이퍼</li>' +
  '<li><b>테이퍼 절삭 장치</b>를 쓰는 방법</li>' +
  '<li><b>총형 바이트</b>를 쓰는 방법</li>' +
  '<li>테이퍼 <b>드릴이나 리머</b>를 쓰는 방법</li>' +
  '</ul>' +
  '심압대 편위량은 다음 식으로 구한다. D 는 큰 지름, d 는 작은 지름, L 은 가공물 전체 길이, ℓ 은 테이퍼 부분 길이다.' +
  '<div class="fm">e = ( D − d ) × L ÷ ( 2 ℓ )</div>' },

{ unit:'7. 선반', t:'선반 작업의 안전', body:
  '<ul>' +
  '<li><b>칩은 손으로 제거하지 않는다.</b> 갈고리를 쓴다</li>' +
  '<li>척의 회전을 손이나 공구로 <b>멈추지 않는다</b></li>' +
  '<li>주축 속도 변환은 <b>반드시 기계를 정지시키고</b> 한다</li>' +
  '<li>선반이 돌아가는 동안 자리를 뜨지 않는다</li>' +
  '<li>긴 가공물은 심압대나 방진구로 받치고 깎는다</li>' +
  '<li>나사를 깎을 때는 <b>저속</b>으로 하고, 끝나면 <b>하프 너트를 반드시 풀어</b> 둔다</li>' +
  '</ul>' },

/* ───────── 8단원 밀링 ───────── */
{ unit:'8. 밀링', t:'밀링 머신의 종류', body:
  '<ul>' +
  '<li><b>수평 밀링 머신</b> — 주축이 수평. 평면 · 각도 · 홈 · 메탈 소 절단</li>' +
  '<li><b>수직 밀링 머신</b> — 주축이 수직. 평면 · 엔드밀 · 홈 · 더브테일 · 키홈</li>' +
  '<li><b>만능 밀링 머신</b> — 테이블이 좌우로 <b>선회</b>해서 나선(헬리컬) 홈을 깎을 수 있다</li>' +
  '<li><b>플레이너형 밀링 머신</b> — 대형 가공물을 깎는 문(門)형 밀링</li>' +
  '</ul>' +
  '밀링의 크기는 <b>테이블 · 새들 · 니의 이동 거리</b>로 나타내며, 보통 호칭 번호로 부른다.' },

{ unit:'8. 밀링', t:'상향 절삭과 하향 절삭', body:
  '<div class="fig"><svg viewBox="0 0 440 170" role="img" aria-label="상향 절삭과 하향 절삭의 회전 방향 비교">' +
  '<g>' +
  '<circle cx="80" cy="60" r="36" fill="none" stroke="#475569" stroke-width="2.5"/>' +
  '<path d="M104 34 A 34 34 0 0 1 108 62" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#am1)"/>' +
  '<rect x="24" y="98" width="130" height="26" fill="#e2e8f0" stroke="#94a3b8"/>' +
  '<line x1="150" y1="111" x2="184" y2="111" stroke="#12a150" stroke-width="3" marker-end="url(#am2)"/>' +
  '<text x="80" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">상향 절삭</text>' +
  '<text x="80" y="166" text-anchor="middle" font-size="11" fill="#6b7684">회전과 이송이 반대</text>' +
  '</g>' +
  '<g>' +
  '<circle cx="320" cy="60" r="36" fill="none" stroke="#475569" stroke-width="2.5"/>' +
  '<path d="M296 34 A 34 34 0 0 0 292 62" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#am1)"/>' +
  '<rect x="264" y="98" width="130" height="26" fill="#e2e8f0" stroke="#94a3b8"/>' +
  '<line x1="390" y1="111" x2="424" y2="111" stroke="#12a150" stroke-width="3" marker-end="url(#am2)"/>' +
  '<text x="320" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">하향 절삭</text>' +
  '<text x="320" y="166" text-anchor="middle" font-size="11" fill="#6b7684">회전과 이송이 같은 방향</text>' +
  '</g>' +
  '<defs>' +
  '<marker id="am1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>' +
  '<marker id="am2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#12a150"/></marker>' +
  '</defs></svg></div>' +
  '<ul>' +
  '<li><b>상향 절삭</b> — 커터의 <b>회전 방향과 이송이 반대</b>. 백래시 영향이 없고 안전하지만, 날이 재료를 문지르며 들어가 <b>공구 수명이 짧고 표면이 거칠다</b></li>' +
  '<li><b>하향 절삭</b> — 커터의 <b>회전 방향과 이송이 같다</b>. 표면이 곱고 공구 수명이 길지만, <b>백래시 제거 장치가 없으면 위험</b>하다</li>' +
  '</ul>' },

{ unit:'8. 밀링', t:'분할법', body:
  '원둘레를 똑같이 나눠 깎는 방법이다. 기어 이나 육각 볼트를 깎을 때 쓴다.' +
  '<ul>' +
  '<li><b>직접 분할법</b> — 분할판 구멍이 24개라 24의 약수(24 · 12 · 8 · 6 · 4 · 3 · 2)만 나눌 수 있다. 정밀도가 필요 없는 볼트 · 너트 · 키홈에 쓴다</li>' +
  '<li><b>단식 분할법</b> — 분할 크랭크를 40:1 로 감속한다. 가장 많이 쓴다</li>' +
  '<li><b>차동 분할법</b> — 단식으로도 안 되는 특수한 수(61 이상의 소수 등)를 나눌 때</li>' +
  '<li><b>각도 분할법</b> — 각도로 지정해 나눌 때</li>' +
  '</ul>' +
  '단식 분할의 크랭크 회전수는' +
  '<div class="fm">n = 40 ÷ N　( N = 나눌 등분 수 )</div>' +
  '분할대 웜기어가 40:1 이라 40 이 나온다. 예를 들어 N=20 이면 크랭크를 2회전 시킨다.' },

{ unit:'8. 밀링', t:'밀링 커터와 엔드밀', body:
  '<ul>' +
  '<li><b>정면 밀링 커터</b> — 넓은 평면을 빠르게 깎는다</li>' +
  '<li><b>플레인(평) 커터</b> — 수평 밀링에서 평면을 깎는다</li>' +
  '<li><b>측면 커터 · 메탈 소</b> — 홈을 파고 잘라 낸다</li>' +
  '<li><b>엔드밀</b> — 2날 · 4날 · 6날이 있고, 러프 엔드밀 · 볼 엔드밀 등이 있다. 홈 · 키홈 · 좁은 평면에 쓴다</li>' +
  '<li><b>총형 커터</b> — 정해진 단면 모양을 그대로 찍어 낸다</li>' +
  '</ul>' +
  '<b>더브테일</b>은 비둘기 꼬리 모양의 홈으로, 새들처럼 미끄러지며 절삭력을 많이 받는 자리에 쓴다.' },

/* ───────── 9단원 연삭 ───────── */
{ unit:'9. 연삭', t:'연삭 가공의 특징', body:
  '<ul>' +
  '<li><b>담금질한 강</b>처럼 단단한 재료도 깎을 수 있다</li>' +
  '<li>정밀도가 높고 표면 거칠기가 우수하다</li>' +
  '<li>연삭 압력과 저항이 작아 <b>전자석 척</b>으로도 고정할 수 있다</li>' +
  '<li>연삭점의 <b>온도가 매우 높다</b></li>' +
  '<li>연삭 속도가 대단히 빠르다</li>' +
  '<li><b>자생 작용</b>이 있다</li>' +
  '</ul>' +
  '<span class="kw">자생 작용</span> — 무뎌진 입자가 스스로 떨어져 나가고 그 밑에서 <b>새 날이 드러나는</b> 것. ' +
  '연삭 숫돌이 계속 잘 깎이는 이유이며, 다른 절삭공구에는 없는 성질이다.' },

{ unit:'9. 연삭', t:'연삭 숫돌의 3요소', body:
  '<div class="fig"><svg viewBox="0 0 320 130" role="img" aria-label="연삭 숫돌을 이루는 입자 결합제 기공">' +
  '<circle cx="160" cy="62" r="56" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>' +
  '<g fill="#475569">' +
  '<circle cx="140" cy="42" r="7"/><circle cx="178" cy="52" r="8"/><circle cx="150" cy="80" r="7"/>' +
  '<circle cx="186" cy="84" r="6"/><circle cx="126" cy="66" r="6"/>' +
  '</g>' +
  '<circle cx="164" cy="66" r="5" fill="#fff" stroke="#94a3b8"/>' +
  '<circle cx="134" cy="92" r="4" fill="#fff" stroke="#94a3b8"/>' +
  '<text x="248" y="40" font-size="12" fill="#475569">● 입자 — 실제로 깎는다</text>' +
  '<text x="248" y="64" font-size="12" fill="#475569">░ 결합제 — 입자를 붙든다</text>' +
  '<text x="248" y="88" font-size="12" fill="#475569">○ 기공 — 칩이 빠져나갈 길</text>' +
  '</svg></div>' +
  '연삭 숫돌은 <span class="kw">입자 · 결합제 · 기공</span> 세 가지로 이루어진다. ' +
  '기공이 있어야 칩이 빠져나간다. 기공이 막히는 것이 뒤에 나오는 <b>눈메움</b>이다.' },

{ unit:'9. 연삭', t:'연삭 숫돌 표시 5요소', body:
  '숫돌 옆면에는 다섯 가지가 정해진 <b>순서대로</b> 적혀 있다.' +
  '<div class="fm">입자 — 입도 — 결합도 — 조직 — 결합제</div>' +
  '<table class="wheel">' +
  '<tr><th>입자</th><td>A(알루미나) · WA(백색 알루미나) · C(탄화규소) · GC(녹색 탄화규소)</td></tr>' +
  '<tr><th>입도</th><td>메시(mesh) 번호. <b>숫자가 클수록 입자가 곱다</b></td></tr>' +
  '<tr><th>결합도</th><td>알파벳. <b>A에 가까울수록 무르고 Z에 가까울수록 단단</b>하다</td></tr>' +
  '<tr><th>조직</th><td>입자가 빽빽한 정도. 0~3 밀, 4~6 중, 7~ 조</td></tr>' +
  '<tr><th>결합제</th><td>V · S · E · R · B · M (아래 카드 참고)</td></tr>' +
  '</table>' +
  '예를 들어 <span class="mono">WA 60 K 5 V</span> 는 백색 알루미나 입자, 60번 입도, 결합도 K(비교적 무름), 조직 5(중간), 비트리파이드 결합제라는 뜻이다.' },

{ unit:'9. 연삭', t:'결합제의 종류와 기호', body:
  '<ul>' +
  '<li><b>V — 비트리파이드</b>: 주성분이 점토와 장석. <span class="kw">연삭 숫돌의 90% 이상</span>을 차지하는 가장 흔한 결합제</li>' +
  '<li><b>S — 실리케이트</b>: 규산나트륨(물유리). 대형 숫돌에 적합</li>' +
  '<li><b>E — 셀락</b>: 천연수지 셀락. 비교적 저온에서 만든다</li>' +
  '<li><b>R — 고무</b>: 생고무가 주성분. 넣는 유황의 양으로 결합도를 조절한다</li>' +
  '<li><b>B — 레지노이드</b>: 베이클라이트가 주성분. 결합력이 강하고 탄성이 커서 <b>절단용</b>이나 정밀 연삭용에 적합</li>' +
  '<li><b>M — 메탈</b>: 다이아몬드 입자를 구리 · 황동 · 니켈 등의 분말과 분말야금으로 결합</li>' +
  '</ul>' +
  '<b>V가 가장 많이 쓰인다</b>는 것과 <b>B는 절단용</b>이라는 것 두 가지가 자주 나온다.' },

{ unit:'9. 연삭', t:'무딤 · 눈메움 · 드레싱 · 트루잉', body:
  '<ul>' +
  '<li><span class="kw">무딤(글레이징)</span> — 결합도가 <b>너무 높아서</b> 무뎌진 입자가 떨어지지 않고 버티는 것. 숫돌 표면이 번들거린다</li>' +
  '<li><span class="kw">눈메움(로딩)</span> — <b>기공에 칩이 메워져</b> 더 깎이지 않는 것</li>' +
  '<li><b>드레싱</b> — 무딤과 눈메움을 걷어 내 <b>새 날을 세우는</b> 작업. 드레서를 쓴다</li>' +
  '<li><b>트루잉</b> — 숫돌이 <b>찌그러진 모양을 바로잡는</b> 작업</li>' +
  '</ul>' +
  '<b>드레싱은 날 세우기, 트루잉은 모양 잡기</b>로 구분한다.' },

{ unit:'9. 연삭', t:'연삭기의 종류와 연삭 균열', body:
  '<ul>' +
  '<li><b>외경 연삭기</b> — 원통의 바깥지름을 깎는다</li>' +
  '<li><b>내면 연삭기</b> — 구멍 안쪽을 깎는다</li>' +
  '<li><b>평면 연삭기</b> — 평평한 면을 깎는다</li>' +
  '<li><b>센터리스 연삭기</b> — 센터로 물리지 않고 깎는다. <b>가늘고 긴</b> 가공물이나 <b>중공</b> 가공물에 유리하고, 연삭 여유가 작아도 되며 자동화가 쉽다</li>' +
  '<li><b>만능 공구 연삭기</b> — 밀링 커터 · 엔드밀 · 드릴 · 바이트 · 호브를 다시 갈 때</li>' +
  '</ul>' +
  '<b>연삭 균열</b> — 연삭열로 표면에 눈에 잘 안 보이는 미세 균열이 생기는 것. ' +
  '탄소 함유량이 <b>많은 강</b>과 <b>담금질강</b>에서 자주 생긴다. ' +
  '대책은 <b>연한 숫돌</b>을 쓰고, 연삭 깊이를 <b>얕게</b>, 이송을 <b>빠르게</b>, 연삭액을 <b>충분히</b> 주는 것이다.' },

/* ───────── 10단원 드릴링·기타 ───────── */
{ unit:'10. 드릴링·기타', t:'드릴링 머신으로 하는 가공', body:
  '<ul>' +
  '<li><b>드릴링</b> — 구멍을 뚫는다</li>' +
  '<li><b>리밍</b> — 뚫린 구멍을 <b>정밀하고 매끄럽게</b> 다듬는다</li>' +
  '<li><b>태핑</b> — 구멍 안에 <b>암나사</b>를 낸다</li>' +
  '<li><b>보링</b> — 뚫린 구멍을 <b>넓힌다</b></li>' +
  '<li><b>카운터 보링</b> — 볼트 <b>머리가 들어가도록</b> 구멍 입구를 원통형으로 넓힌다</li>' +
  '<li><b>카운터 싱킹</b> — 접시머리 나사가 들어가도록 <b>원뿔형</b>으로 넓힌다</li>' +
  '<li><b>스폿 페이싱</b> — 볼트가 닿는 자리를 <b>평평하게</b> 깎는다</li>' +
  '</ul>' +
  '<b>보링은 넓히기, 리밍은 다듬기</b>다. 둘을 바꿔 쓰지 않는다.' },

{ unit:'10. 드릴링·기타', t:'탭 작업과 나사', body:
  '<ul>' +
  '<li><b>탭</b> — 암나사를 낸다. 보통 3개가 한 조이고 <b>1번(황삭) → 2번(중간) → 3번(다듬질)</b> 순서로 쓴다</li>' +
  '<li><b>다이스</b> — 수나사를 낸다</li>' +
  '</ul>' +
  '탭 구멍(하부 구멍) 지름은 대략 다음과 같다. p 는 나사의 피치다.' +
  '<div class="fm">d = D − p</div>' +
  '<b>탭이 부러지는 이유</b> — 구멍이 너무 작거나 구부러졌을 때, 탭이 경사지게 들어갔을 때, ' +
  '탭에 맞지 않는 핸들을 썼을 때, 무리한 힘을 주거나 너무 빨리 돌렸을 때, 막힌 구멍에 칩이 찼을 때' },

{ unit:'10. 드릴링·기타', t:'셰이퍼 · 플레이너 · 슬로터', body:
  '왕복 운동으로 깎는 기계들이다.' +
  '<ul>' +
  '<li><b>셰이퍼(형삭기)</b> — <b>공구</b>가 수평으로 왕복한다. 작은 평면</li>' +
  '<li><b>플레이너(평삭기)</b> — <b>가공물</b>이 왕복한다. 큰 평면</li>' +
  '<li><b>슬로터(수직 셰이퍼)</b> — 공구가 <b>수직</b>으로 왕복한다. 키홈 · 스플라인 · 세레이션</li>' +
  '</ul>' +
  '셰이퍼는 공구가 움직이고 플레이너는 가공물이 움직인다 — 이 한 줄이 핵심이다.' },

{ unit:'10. 드릴링·기타', t:'브로칭과 기어 절삭', body:
  '<b>브로칭</b> — 여러 날이 차례로 커지는 긴 공구(브로치)를 한 번 통과시켜 단번에 완성한다. ' +
  '가공물에 <b>밀어 넣는 압입식</b>과 <b>잡아당기는 인발식</b>이 있고, ' +
  '브로칭 머신의 크기는 <b>최대 인장력과 최대 행정 길이</b>로 나타낸다.' +
  '<br><br><b>기어 절삭법 3가지</b>' +
  '<ul>' +
  '<li><b>형판(템플릿)</b>에 의한 치형 가공</li>' +
  '<li><b>총형 공구</b>에 의한 가공 — 이 홈 모양 그대로 생긴 커터로 판다</li>' +
  '<li><b>창성법</b> — 공구와 가공물이 맞물려 돌면서 이가 저절로 만들어진다. 호브 · 기어 셰이퍼가 여기 속한다</li>' +
  '</ul>' },

/* ───────── 11단원 정밀입자·특수가공 ───────── */
{ unit:'11. 정밀·특수가공', t:'래핑', body:
  '가공물과 랩(공구) 사이에 <span class="kw">랩제</span>를 넣고 문질러 다듬는 가공이다.' +
  '<ul>' +
  '<li>가공면이 <b>거울면</b>처럼 매끈해진다</li>' +
  '<li>정밀도가 높고, 평면도 · 진원도 · 진직도가 좋아진다</li>' +
  '<li>가공면의 <b>윤활성과 내마모성</b>이 좋아진다</li>' +
  '<li>가공이 간단하고 대량생산이 가능하다</li>' +
  '</ul>' +
  '<b>습식</b>은 랩제와 래핑유를 함께 넣어 고압 · 고속으로 하고, <b>건식</b>은 그보다 더 정밀한 다듬질에 쓴다. ' +
  '랩제로는 탄화규소(SiC)와 산화알루미나(Al₂O₃)를 주로 쓰고, 강을 래핑할 때 랩은 보통 <b>주철</b>을 쓴다.' },

{ unit:'11. 정밀·특수가공', t:'호닝과 슈퍼피니싱', body:
  '<ul>' +
  '<li><b>호닝</b> — 여러 개의 각봉 숫돌을 붙인 <b>혼</b>을 <b>회전 + 왕복</b>시켜 <b>구멍 안쪽</b>을 다듬는다. 엔진 실린더 내면이 대표적이다. 숫돌 자국이 교차하는 그물 무늬가 남는다</li>' +
  '<li><b>슈퍼피니싱</b> — 고운 숫돌을 <b>가볍게 눌러 짧게 진동</b>시키며 다듬는다. 가공면에 <b>방향성이 없고</b>, 변질층이 매우 얇으며, 가공 시간이 짧다</li>' +
  '</ul>' +
  '<b>호닝은 구멍 안, 슈퍼피니싱은 바깥면</b>이 대표적인 자리다.' },

{ unit:'11. 정밀·특수가공', t:'배럴 · 쇼트피닝 · 버니싱', body:
  '<ul>' +
  '<li><b>배럴 가공</b> — 통 안에 가공물 · 숫돌 입자 · 가공액 · 콤파운드를 함께 넣고 <b>돌려서</b> 서로 부딪히게 해 다듬는다. 광택이 필요하면 나무 · 가죽 · 톱밥을 넣는다</li>' +
  '<li><b>쇼트피닝</b> — 작은 <b>강구를 세게 때려</b> 표면에 압축 잔류응력을 준다. <span class="kw">피로강도가 올라가고</span> 표면이 경화된다. 쇼트로는 칠드주철 · 가단주철 · 주강 · 컷 와이어 쇼트를 쓴다</li>' +
  '<li><b>버니싱</b> — 구멍보다 <b>조금 큰 강구를 밀어 넣어 통과</b>시켜 안지름 표면을 소성변형으로 다듬는다</li>' +
  '</ul>' +
  '셋 다 <b>칩을 내지 않고</b> 표면을 좋게 만든다는 공통점이 있다.' },

{ unit:'11. 정밀·특수가공', t:'방전 가공', body:
  '가공액 속에서 전극과 가공물 사이에 <b>불꽃 방전</b>을 일으켜 조금씩 녹여 없애는 가공이다.' +
  '<ul>' +
  '<li>가공물의 <b>경도와 관계없이</b> 가공할 수 있다 — 담금질한 강, 초경합금도 깎인다</li>' +
  '<li>전극 형상 그대로 정밀하게 가공된다</li>' +
  '<li>전극과 가공물에 <b>큰 힘이 걸리지 않는다</b></li>' +
  '<li>전극은 구리나 흑연처럼 <b>연한 재료</b>를 써서 만들기 쉽다</li>' +
  '<li>다만 <b>전극이 필요</b>하고, 가공 부분에 <b>변질층</b>이 남는다</li>' +
  '</ul>' +
  '가공물은 <b>+극</b>, 전극은 <b>−극</b>에 연결한다.' },

{ unit:'11. 정밀·특수가공', t:'전해 · 화학 · 초음파 · 레이저', body:
  '<ul>' +
  '<li><b>전해 연마</b> — 전해액 속에서 전기를 걸어 표면을 녹여 낸다. 가공 변질층이 없고 <b>방향성이 없으며</b>, 복잡한 형상도 되고 내마모성 · 내부식성이 좋아진다</li>' +
  '<li><b>전해 연삭</b> — 전해 연마에 숫돌 접촉을 더해 능률을 올린 것. 정밀도는 기계 연삭보다 낮다</li>' +
  '<li><b>화학 밀링(화학 절삭)</b> — 깎지 않을 부분에 <b>내식성 피막</b>을 입히고 나머지를 부식시킨다. 넓은 면 · 복잡한 형상 · 얇은 가공물에 유리하다</li>' +
  '<li><b>초음파 가공</b> — 16~30 kHz 정도의 진동으로 지립을 때려 깎는다. 유리 · 세라믹처럼 <b>단단하고 잘 깨지는</b> 재료에 쓴다</li>' +
  '<li><b>워터 제트</b> — 고속 액체 제트로 금속 · 플라스틱 · 목재 · 천을 자른다</li>' +
  '</ul>' },

/* ───────── 12단원 측정과 치공구 ───────── */
{ unit:'12. 측정·치공구', t:'버니어 캘리퍼스의 최소 읽음값', body:
  '어미자 눈금 1 mm 짜리에서, 어미자의 <b>19 mm 를 20등분</b>하거나 <b>39 mm 를 20등분</b>한 아들자를 쓰면 ' +
  '최소 읽음값이 <span class="kw">0.05 mm</span> 가 된다. 어미자 눈금 한 칸과 아들자 한 칸의 <b>차이</b>가 최소 읽음값이다.' +
  '<br><br><b>읽는 순서</b> — ① 아들자의 0 이 지나온 어미자 눈금을 읽고 ② 어미자 눈금과 <b>일직선으로 딱 맞는</b> 아들자 눈금을 찾아 더한다.' },

{ unit:'12. 측정·치공구', t:'마이크로미터', body:
  '스핀들의 나사 피치가 0.5 mm 이고 딤블이 50등분되어 있으면' +
  '<div class="fm">0.5 mm ÷ 50 = 0.01 mm</div>' +
  '가 최소 읽음값이다. <b>슬리브를 먼저 읽고 딤블을 더한다.</b>' +
  '<br><br>특수 마이크로미터로는 나사의 <b>유효지름</b>을 재는 나사 마이크로미터, ' +
  '드릴 홈 · 나사 골지름 · 곡면 두께를 재는 <b>포인트 마이크로미터</b> 등이 있다.' },

{ unit:'12. 측정·치공구', t:'블록 게이지와 다이얼 게이지', body:
  '<b>블록 게이지</b> — 길이의 기준이 되는 게이지. 여러 개를 <span class="kw">밀착(링깅)</span>시켜 필요한 치수를 만든다.' +
  '<ul>' +
  '<li>형상 — <b>요한슨형</b>(직사각형) · <b>호크형</b>(가운데 구멍 뚫린 정사각형) · <b>캐리형</b>(가운데 구멍 뚫린 원형)</li>' +
  '<li>등급 — <b>AA · A · B · C</b> 급</li>' +
  '<li>재질은 온도에 의한 오차를 줄이려고 주로 <b>탄소강</b>을 쓴다</li>' +
  '</ul>' +
  '<b>다이얼 게이지</b> — 소형 · 경량이고 눈금과 지침으로 읽어 오차가 적으며, ' +
  '<b>연속된 변위량</b>을 잴 수 있고 여러 곳을 동시에 잴 수 있다. 절대 치수가 아니라 <b>차이</b>를 재는 비교 측정기다.' },

{ unit:'12. 측정·치공구', t:'측정의 원칙과 오차', body:
  '<ul>' +
  '<li>측정 표준 온도는 <span class="kw">20℃</span> 다</li>' +
  '<li><b>아베의 원리</b> — 표준자와 측정물을 <b>같은 축선 위</b>에 놓아야 가장 정밀하다</li>' +
  '<li><b>우연 오차</b> — 자연 현상 등 원인을 알 수 없는 오차. <b>여러 번 재서 평균</b>을 내면 줄일 수 있다</li>' +
  '<li>긴 표준자는 자중으로 휘므로, 양 끝면을 평행하게 두려면 <b>에어리점(0.2113 L)</b>, 전체 길이 오차를 최소화하려면 <b>베셀점(0.2203 L)</b>에서 받친다</li>' +
  '</ul>' +
  '<b>사인바</b>는 양 롤러의 <b>중심거리</b>로 크기를 나타내고, 각도가 <span class="kw">45°를 넘으면 오차가 커져</span> 45° 이내에서 쓴다.' },

{ unit:'12. 측정·치공구', t:'한계 게이지와 각종 게이지', body:
  '<ul>' +
  '<li><b>한계 게이지</b> — 최대 · 최소 허용치수로 만든 게이지로 <b>합격인지 불합격인지만</b> 가린다. 치수 값을 읽지는 않는다</li>' +
  '<li><b>틈새(필러) 게이지</b> — 두 면 사이의 틈을 잰다</li>' +
  '<li><b>옵티컬 플랫(광선정반)</b> — <b>평면도</b>를 본다</li>' +
  '<li><b>옵티컬 파라렐</b> — <b>평행도</b>를 본다</li>' +
  '</ul>' +
  '평면도는 플랫, 평행도는 파라렐 — 이름 그대로다.' },

{ unit:'12. 측정·치공구', t:'치공구 — 지그와 고정구', body:
  '<ul>' +
  '<li><b>지그(jig)</b> — 위치를 잡아 줄 뿐 아니라 <b>공구를 안내</b>한다(드릴 부시 등)</li>' +
  '<li><b>고정구(fixture)</b> — 정확한 위치 결정과 <b>강력한 고정</b>을 맡는다. 공구를 안내하지는 않는다</li>' +
  '</ul>' +
  '<b>공구를 안내하는가</b>가 둘을 가른다.' +
  '<br><br>치공구를 쓰면 미숙련자도 정밀 작업을 할 수 있고, 정밀도와 호환성이 올라가며, ' +
  '검사가 단순해지고 공정이 짧아진다. ' +
  '치공구의 공차는 보통 <b>공작물 공차의 20~50%</b> 범위로 잡는다.' },

{ unit:'12. 측정·치공구', t:'3-2-1 위치 결정', body:
  '<div class="fig"><svg viewBox="0 0 340 160" role="img" aria-label="육면체의 3-2-1 위치 결정">' +
  '<path d="M70 118 L210 118 L250 88 L110 88 Z" fill="#e2e8f0" stroke="#94a3b8"/>' +
  '<path d="M70 118 L70 58 L210 58 L210 118 Z" fill="#f1f5f9" stroke="#94a3b8"/>' +
  '<path d="M210 118 L210 58 L250 28 L250 88 Z" fill="#cbd5e1" stroke="#94a3b8"/>' +
  '<g fill="#e5484d">' +
  '<circle cx="110" cy="112" r="5"/><circle cx="180" cy="112" r="5"/><circle cx="150" cy="94" r="5"/>' +
  '</g>' +
  '<g fill="#2563eb"><circle cx="100" cy="98" r="5"/><circle cx="100" cy="70" r="5"/></g>' +
  '<g fill="#12a150"><circle cx="228" cy="76" r="5"/></g>' +
  '<text x="272" y="40" font-size="12" fill="#e5484d" font-weight="700">● 3개 — 가장 넓은 면</text>' +
  '<text x="272" y="62" font-size="12" fill="#2563eb" font-weight="700">● 2개 — 다음 넓은 면</text>' +
  '<text x="272" y="84" font-size="12" fill="#12a150" font-weight="700">● 1개 — 좁은 면</text>' +
  '</svg></div>' +
  '육면체를 가장 안정되게 앉히는 방법이다. <b>가장 넓은 면에 3개</b>, ' +
  '<b>그다음 넓은 면에 2개</b>, <b>좁은 면에 1개</b>의 위치결정구를 둔다. ' +
  '점 3개가 하나의 평면을 정하기 때문에 3개부터 시작한다.' +
  '<br><br><b>방오법(fool proofing)</b> — 공작물을 <b>잘못된 방향으로는 아예 놓을 수 없게</b> 만드는 설계다.' },

/* ───────── 13단원 기계제작법(비절삭) ───────── */
{ unit:'13. 주조·소성', t:'주조와 주물사', body:
  '녹인 금속을 주형에 부어 굳히는 것이 <b>주조</b>다. 주형을 만드는 모래가 <b>주물사</b>이며 다음을 갖춰야 한다.' +
  '<ul>' +
  '<li><b>통기성</b>과 성형성이 좋을 것 — 가스가 빠져나가야 한다</li>' +
  '<li>주물 표면이 아름다울 것</li>' +
  '<li>적당한 <b>강도</b>를 가질 것</li>' +
  '<li><b>내열성</b>이 크고 화학적 변화가 적을 것</li>' +
  '<li>값이 싸고 <b>반복 사용</b>이 가능할 것</li>' +
  '</ul>' +
  '통기성이 나쁘면 가스가 갇혀 <span class="kw">기공</span>이 생기고, 쇳물이 부족하면 <span class="kw">수축공</span>이 생긴다.' },

{ unit:'13. 주조·소성', t:'용해로 — 무엇을 녹이는가', body:
  '<ul>' +
  '<li><b>큐폴라</b> — <b>주철</b>을 녹인다. 크기는 <b>매시간 녹일 수 있는 무게</b>로 나타낸다</li>' +
  '<li><b>도가니로</b> — <b>비철금속</b>을 녹인다. 크기는 1회에 녹일 수 있는 구리의 무게</li>' +
  '<li><b>전로 · 반사로</b> — <b>주강</b>을 녹인다. 크기는 1회에 녹일 수 있는 무게</li>' +
  '</ul>' +

{ unit:'13. 주조·소성', t:'소성가공과 가공경화', body:

   배우기는 학생이 혼자 읽는 줄글 카드다. 이것은 교실 앞에 띄우는 슬라이드다.

function openBoardPro(){
  if(!window.BoardPro || !(window.LESSON||[]).length){
    alert('수업자료를 불러오지 못했습니다.'); return;
  }
  const ALL = window.LESSON, FIG = window.FIGS || {};
  const units = [...new Set(ALL.map(s=>s.u))];
  const menu = units.map(u=>{
    const list = ALL.filter(s=>s.u===u);
    return { icon:'📊', title:u,
             desc:'슬라이드 '+list.length+'장 · '+list[0].t,
             run:{ kind:'lesson', deck:list } };
  });
  menu.push({ icon:'📚', wide:true, title:'전체 이어서 ('+ALL.length+'장)',
              desc:'절삭의 원리부터 열처리까지 순서대로 진행합니다.',
              run:{ kind:'lesson', deck:ALL } });
  menu.push({ icon:'⬜', wide:true, title:'빈 칠판',
              desc:'슬라이드 없이 판서만. 필기하며 설명할 때.',
              run:{ kind:'blank' } });
  BoardPro.open({
    title:'📽️ 기계공작법 · 절삭가공 · 수업 슬라이드',
    sub:'요점 → <b>발문</b> → 퀴즈 → 정답을 하나씩 열며 진행하고, 화면 어디든 손이나 펜으로 바로 판서할 수 있습니다.<br>'+
        '요점 속 <b>파란 빈칸</b>은 눌러야 답이 보입니다.',
    menu: menu,
    fig: s => (s.fig && FIG[s.fig]) ? FIG[s.fig]() : ''
  });
}

function render(view){
  const v = $('#view');
  v.innerHTML = '';
  window.scrollTo(0,0);
  if(view==='learn')    return renderLearn(v);
  if(view==='game')     return renderGameMenu(v);
  if(view==='practice') return startQuiz(v,'practice');
  if(view==='exam')     return startQuiz(v,'exam');
  if(view==='wrong')    return renderWrong(v);
}

/* ── 배우기 ── */
function renderLearn(v){
  const bar = el('<div class="units"></div>');
  ['전체'].concat(UNITS).forEach(u=>{
    const b = el('<button class="unitbtn'+(u===learnUnit?' on':'')+'">'+esc(u)+'</button>');
    b.onclick = ()=>{ learnUnit=u; render('learn'); };
    bar.appendChild(b);
  });
  v.appendChild(bar);

  const list = learnUnit==='전체' ? LEARN : LEARN.filter(c=>c.unit===learnUnit);
  list.forEach(c=>{
    v.appendChild(el('<div class="card">' +
      '<span class="pill">'+esc(c.unit||'')+'</span>' +
      '<h3>'+esc(c.t)+'</h3>' +
      '<div class="body">'+c.body+'</div></div>'));
  });

  const foot = el('<div class="card row"><b>다 읽었으면</b></div>');
  const g = el('<button class="btn">🎮 게임으로 익히기</button>');
  const p = el('<button class="btn btn-primary">✏️ 연습 '+CFG.practiceN+'문항 풀어보기</button>');
  g.onclick = ()=>goTab('game');
  p.onclick = ()=>goTab('practice');
  foot.appendChild(g); foot.appendChild(p);
  v.appendChild(foot);
}

    '연속으로 맞히면 <b>콤보</b>가 쌓입니다. 끝나면 결과를 제출할 수 있습니다.</div></div>'));
  const menu = el('<div class="gmenu"></div>');
  GAMES.forEach(g=>{
    const best = ST.best && ST.best[g.id];
    const b = el('<button class="gcard">' +
      '<div class="ge">'+g.emoji+'</div>' +
      '<h4>'+esc(g.name)+'</h4>' +
      '<p>'+esc(g.desc)+'</p>' +
      (best!=null ? '<p style="margin-top:6px"><span class="pill">최고 '+best+'점</span></p>' : '') +
      '</button>');
    b.onclick = ()=>startGame(g.id);
    menu.appendChild(b);
  });
  v.appendChild(menu);
}

let G = null;   // 진행 중인 게임 상태

function startGame(id){
  const g = GAMES.filter(x=>x.id===id)[0];
  G = { id, name:g.name, i:0, correct:0, combo:0, maxCombo:0, wrong:[], start:Date.now(), locked:false };
  nextRound();
}

function gameHud(){
  return '<div class="hud">' +
    '<div class="box">' + (G.i+1) + ' / ' + CFG.gameRounds + '</div>' +
    '<div class="box">⭕ ' + G.correct + '</div>' +
    (G.combo>1 ? '<div class="box combo">🔥 ' + G.combo + ' 연속</div>' : '') +
    '<button class="btn" id="gQuit">그만두기</button>' +
    '</div>';
}

function mountHud(v){
  v.appendChild(el(gameHud()));
  const q = $('#gQuit'); if(q) q.onclick = ()=>goTab('game');
  v.appendChild(el('<div class="progress"><i style="width:' + (G.i/CFG.gameRounds*100) + '%"></i></div>'));
}

/* 채점은 한 번만 — locked 로 두 번 눌리는 것을 막는다 */
function gradeGame(ok, btn, explain, wrongLabel){
  if(G.locked) return;
  G.locked = true;
  if(ok){ G.correct++; G.combo++; if(G.combo>G.maxCombo) G.maxCombo=G.combo; }
  else  { G.combo=0; if(wrongLabel) G.wrong.push(wrongLabel); }
  try{ if(window.FX && btn) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX', e); }
  try{ if(window.FX && ok && G.combo>=3) FX.punch && FX.punch(btn); }catch(e){}

  const box = $('#gExp');
  if(box){
    box.appendChild(el('<div class="explain"><b>' + (ok?'맞았습니다':'아쉽습니다') + '</b><br>' + explain + '</div>'));
    const last = (G.i+1) >= CFG.gameRounds;
    const nx = el('<div class="row" style="margin-top:12px"><button class="btn btn-primary">' +
                  (last?'결과 보기':'다음 문제 →') + '</button></div>');
    box.appendChild(nx);
    nx.querySelector('button').onclick = ()=>{ G.i++; last ? finishGame() : nextRound(); };
  }
}

function nextRound(){
  G.locked = false;
  const v = $('#view');
  v.innerHTML = '';
  mountHud(v);
  if(G.id==='calc')  return roundCalc(v);
  if(G.id==='ident') return roundIdent(v);
  if(G.id==='wheel') return roundWheel(v);
  if(G.id==='match') return roundMatch(v);
}

/* ───── 게임 1. 절삭 계산 ───── */
const PI = 3.14;
function makeCalc(){
  const kind = pick1(['V','N','T','F','DIV']);
  if(kind==='V'){
    const D = pick1([20,25,30,40,50,60,80,100,120]);
    const N = pick1([200,250,300,400,500,600,800,1000]);
    const ans = PI*D*N/1000;
    return { q:'지름 ' + D + ' mm 인 가공물을 ' + N + ' rpm 으로 절삭할 때 <b>절삭 속도</b>는 몇 m/min 인가?',
      hint:'π = 3.14 로 계산하고, 소수 둘째 자리에서 반올림합니다.',
      unit:'m/min', ans:Math.round(ans*10)/10, tol:0.6,
      ex:'V = πDN ÷ 1000 = 3.14 × ' + D + ' × ' + N + ' ÷ 1000 = ' + (Math.round(ans*10)/10) + ' m/min' };
  }
  if(kind==='N'){
    const D = pick1([20,25,40,50,80,100]);
    const N = pick1([200,300,400,500,600,800]);
    const V = Math.round(PI*D*N/1000*10)/10;
    return { q:'지름 ' + D + ' mm 인 가공물을 절삭 속도 ' + V + ' m/min 로 깎으려면 <b>회전수</b>를 몇 rpm 으로 해야 하는가?',
      hint:'π = 3.14 로 계산하고, 정수로 답합니다.',
      unit:'rpm', ans:N, tol:3,
      ex:'N = 1000V ÷ (πD) = 1000 × ' + V + ' ÷ (3.14 × ' + D + ') ≒ ' + N + ' rpm' };
  }
  if(kind==='T'){
    const L = pick1([100,150,200,240,300,360]);
    const f = pick1([0.1,0.2,0.25,0.3,0.4]);
    const N = pick1([200,300,400,500,600]);
    const ans = L/(f*N);
    return { q:'선반에서 길이 ' + L + ' mm 를 이송 ' + f + ' mm/rev, 회전수 ' + N + ' rpm 으로 1회 절삭할 때 <b>가공 시간</b>은 몇 분인가?',
      hint:'소수 둘째 자리에서 반올림합니다.',
      unit:'분', ans:Math.round(ans*100)/100, tol:0.02,
      ex:'T = L ÷ (f × N) = ' + L + ' ÷ (' + f + ' × ' + N + ') = ' + (Math.round(ans*100)/100) + '분' };
  }
  if(kind==='F'){
    const fz = pick1([0.1,0.15,0.2,0.25,0.3]);
    const z  = pick1([4,6,8,10,12]);
    const N  = pick1([200,300,400,500,600]);
    const ans = fz*z*N;
    return { q:'날 수 ' + z + '개인 밀링 커터를 ' + N + ' rpm 으로 돌리고 날 하나당 이송량을 ' + fz + ' mm 로 할 때 <b>이송 속도</b>는 몇 mm/min 인가?',
      hint:'날 하나당 이송량 × 날 수 × 회전수 입니다.',
      unit:'mm/min', ans:Math.round(ans*10)/10, tol:0.5,
      ex:'f = f<sub>z</sub> × z × N = ' + fz + ' × ' + z + ' × ' + N + ' = ' + (Math.round(ans*10)/10) + ' mm/min' };
  }
  const N = pick1([2,4,5,8,10,16,20,40]);
  const ans = 40/N;
  return { q:'밀링 <b>단식 분할법</b>으로 원둘레를 ' + N + '등분 하려면 분할 크랭크를 몇 회전시켜야 하는가?',
    hint:'분할대의 웜기어 감속비를 떠올려 봅니다.',
    unit:'회전', ans:Math.round(ans*100)/100, tol:0.02,
    ex:'n = 40 ÷ N = 40 ÷ ' + N + ' = ' + (Math.round(ans*100)/100) + '회전' };
}

function roundCalc(v){
  const p = makeCalc();
  const card = el('<div class="card">' +
    '<div class="gq">' + p.q + '</div>' +
    '<div class="muted" style="margin-bottom:10px">' + esc(p.hint) + '</div>' +
    '<div class="row"><input class="numin" id="gNum" type="number" step="any" inputmode="decimal" placeholder="답">' +
    '<b>' + esc(p.unit) + '</b>' +
    '<button class="btn btn-primary" id="gGo">확인</button></div>' +
    '<div id="gExp"></div></div>');
  v.appendChild(card);
  const inp = $('#gNum'), go = $('#gGo');
  const submit = ()=>{
    if(G.locked) return;
    const val = parseFloat(inp.value);
    if(isNaN(val)){ inp.focus(); return; }
    inp.disabled = true; go.disabled = true;
    const ok = Math.abs(val - p.ans) <= p.tol;
    gradeGame(ok, go, p.ex, ok?null:('계산 — 정답 ' + p.ans + ' ' + p.unit));
  };
  go.onclick = submit;
  inp.onkeydown = e => { if(e.key==='Enter') submit(); };
  inp.focus();
}

/* ───── 게임 3. 연삭 숫돌 표시 읽기 ───── */
const WH_ABR = [
  { c:'A',  d:'갈색 알루미나 — 일반강용' },
  { c:'WA', d:'백색 알루미나 — 담금질강·정밀 연삭용' },
  { c:'C',  d:'탄화규소 — 주철·비철금속용' },
  { c:'GC', d:'녹색 탄화규소 — 초경합금용' },
];
const WH_BOND = [
  { c:'V', d:'비트리파이드 — 가장 많이 쓰는 결합제' },
  { c:'S', d:'실리케이트 — 대형 숫돌용' },
  { c:'E', d:'셀락 — 천연수지' },
  { c:'R', d:'고무' },
  { c:'B', d:'레지노이드 — 절단용 숫돌에 적합' },
  { c:'M', d:'메탈 — 다이아몬드 숫돌용' },
];
function gradeWord(g){
  if(g<='G') return '극연';
  if(g<='K') return '연';
  if(g<='O') return '중';
  if(g<='S') return '경';
  return '극경';
}
function structWord(s){ return s<=3 ? '밀(빽빽함)' : (s<=6 ? '중(보통)' : '조(성김)'); }

function roundWheel(v){
  const abr  = pick1(WH_ABR);
  const mesh = pick1([36,46,60,80,100,120,150]);
  const gr   = pick1(['F','H','J','K','L','M','N','P','R','T']);
  const st   = pick1([2,3,5,6,8,9]);
  const bond = pick1(WH_BOND);
  const spec = abr.c + ' ' + mesh + ' ' + gr + ' ' + st + ' ' + bond.c;

  const asks = [
    { q:'다음 숫돌 표시에서 <b>입자</b>를 나타내는 부분은?', ans:abr.c,
      opts:[abr.c, String(mesh), gr, String(st), bond.c],
      ex:'맨 앞에 오는 것이 입자입니다. ' + abr.c + ' — ' + abr.d },
    { q:'다음 숫돌 표시에서 <b>결합제</b>를 나타내는 부분은?', ans:bond.c,
      opts:[abr.c, String(mesh), gr, String(st), bond.c],
      ex:'맨 뒤에 오는 것이 결합제입니다. ' + bond.c + ' — ' + bond.d },
    { q:'다음 숫돌 표시에서 <b>입도</b>를 나타내는 부분은?', ans:String(mesh),
      opts:[abr.c, String(mesh), gr, String(st), bond.c],
      ex:'메시 번호로 적는 것이 입도입니다. ' + mesh + '번은 숫자가 클수록 입자가 곱다는 뜻입니다.' },
    { q:'다음 숫돌 표시에서 <b>결합도</b>는 어느 정도인가?', ans:gradeWord(gr),
      opts:['극연','연','중','경','극경'],
      ex:'결합도 ' + gr + ' → ' + gradeWord(gr) + ' 에 해당합니다. A 에 가까울수록 무르고 Z 에 가까울수록 단단합니다.' },
    { q:'다음 숫돌 표시에서 <b>조직</b>은 어떤 상태인가?', ans:structWord(st),
      opts:['밀(빽빽함)','중(보통)','조(성김)'],
      ex:'조직 ' + st + ' → ' + structWord(st) + ' 입니다. 0~3 은 밀, 4~6 은 중, 7 이상은 조로 봅니다.' },
  ];
  const ask = pick1(asks);
  const opts = shuffle(ask.opts.filter((v,i,a)=>a.indexOf(v)===i));

  const card = el('<div class="card">' +
    '<div class="gq">' + ask.q + '</div>' +
    '<div class="fig"><div class="mono">' + esc(spec) + '</div>' +
    '<div class="figcap">연삭 숫돌 옆면에 적힌 표시</div></div>' +
    '<div id="chs"></div><div id="gExp"></div></div>');
  v.appendChild(card);
  const chs = card.querySelector('#chs');
  opts.forEach(o=>{
    const b = el('<button class="choice">' + esc(o) + '</button>');
    b.onclick = ()=>{
      if(G.locked) return;
      document.querySelectorAll('.choice').forEach(x=>{
        x.disabled = true;
        if(x.textContent === ask.ans) x.classList.add('correct');
      });
      const ok = o === ask.ans;
      if(!ok) b.classList.add('wrong','picked');
      gradeGame(ok, b, ask.ex, ok?null:('숫돌 표시 — ' + spec + ' 읽기'));
    };
    chs.appendChild(b);
  });
}

function roundMatch(v){
  const set = shuffle(PAIRS.slice()).slice(0,4);
  const left = shuffle(set.slice());
  const right = shuffle(set.slice());
  let sel = null, matched = 0;
  const wrongHere = [];

  const card = el('<div class="card">' +
    '<div class="gq">왼쪽 가공과 알맞은 오른쪽을 짝지으세요.</div>' +
    '<div class="row" style="align-items:flex-start;gap:14px">' +
    '<div style="flex:1;min-width:150px" id="colL"></div>' +
    '<div style="flex:1;min-width:150px" id="colR"></div>' +
    '</div><div id="gExp"></div></div>');
  v.appendChild(card);

  const colL = card.querySelector('#colL'), colR = card.querySelector('#colR');
  left.forEach(p=>{
    const b = el('<button class="tile" style="width:100%;margin-bottom:8px;text-align:left">' + esc(p[0]) + '</button>');
    b.dataset.key = p[0];
    b.onclick = ()=>{
      if(b.classList.contains('done')) return;
      colL.querySelectorAll('.tile').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); sel = b;
    };
    colL.appendChild(b);
  });
  right.forEach(p=>{
    const b = el('<button class="tile" style="width:100%;margin-bottom:8px;text-align:left">' + esc(p[1]) + '</button>');
    b.dataset.key = p[0];
    b.onclick = ()=>{
      if(b.classList.contains('done') || !sel) return;
      if(b.dataset.key === sel.dataset.key){
        b.classList.add('done'); sel.classList.add('done'); sel.classList.remove('on');
        try{ if(window.FX) FX.ok(b); }catch(e){}
        sel = null; matched++;
        if(matched === set.length){
          const list = set.map(p=>'· ' + esc(p[0]) + ' → <b>' + esc(p[1]) + '</b>').join('<br>');
          gradeGame(wrongHere.length===0, b, list,
            wrongHere.length ? ('짝짓기 — ' + wrongHere.join(', ')) : null);
        }
      } else {
        try{ if(window.FX) FX.no(b); }catch(e){}
        wrongHere.push(sel.dataset.key);
        sel.classList.remove('on'); sel = null;
      }
    };
    colR.appendChild(b);
  });
}

/* ── 게임 끝 ── */
function finishGame(){
  const n = CFG.gameRounds;
  const pct = Math.round(G.correct / n * 100);
  const sec = Math.round((Date.now() - G.start)/1000);
  const part = G.name;
  const v = $('#view');
  v.innerHTML = '';

  if(!ST.best) ST.best = {};
  if(ST.best[G.id]==null || pct > ST.best[G.id]) ST.best[G.id] = pct;
  save();

  v.appendChild(el('<div class="card" style="text-align:center">' +
    '<div class="score">' + pct + '점</div>' +
    '<div class="muted">' + n + '문제 중 ' + G.correct + '개 정답 · 최대 ' + G.maxCombo + ' 연속 · ' +
      Math.floor(sec/60) + '분 ' + (sec%60) + '초</div>' +
    '<div id="rankBox" style="margin-top:12px"></div>' +
    '<div id="rSubmitAnchor" style="margin-top:12px"></div></div>'));

  mountSubmit(pct, G.correct, n, sec, part, G.wrong.map(w=>({label:w})));

  const again = el('<div class="card row">' +
    '<button class="btn btn-primary" id="gAgain">🔁 한 번 더</button>' +
    '<button class="btn" id="gBack">🎮 다른 게임</button></div>');
  v.appendChild(again);
  $('#gAgain').onclick = ()=>startGame(G.id);
  $('#gBack').onclick  = ()=>goTab('game');

  try{
    if(window.FX && pct>=60){
      FX.banner({ title: pct>=90?'훌륭합니다!':'통과!', sub: part + ' ' + pct + '점',
                  stars: FX.starsFor ? FX.starsFor(pct) : 0 });
    }
  }catch(e){ console.warn('FX', e); }
  try{
    if(window.Rank){
      const res = Rank.award(pct, { mode:'기계공작법·절삭가공 — ' + part });
      $('#rankBox').innerHTML = Rank.resultBox(res);
    }
  }catch(e){ console.warn('Rank', e); }
}

/* ══════════════════ 문제 풀이 ══════════════════
   연습  : 고르는 즉시 정답·해설 공개, 점수 실시간, 연출 있음
   종합  : 아무것도 알려주지 않음, 점수 감춤, 연출 없음 (규약 2)  */
function startQuiz(v, mode){
  const n = mode==='exam' ? CFG.examN : CFG.practiceN;
  quiz = { mode, i:0, correct:0, picks:[],
           list: shuffle(QUESTIONS.slice()).slice(0, Math.min(n, QUESTIONS.length)),
           startTime: Date.now(), locked:false };
  if(!quiz.list.length){ v.appendChild(el('<div class="empty">문항이 아직 없습니다.</div>')); return; }
  drawQ(v);
}

function drawQ(v){
  quiz.locked = false;
  const q = quiz.list[quiz.i];
  const isExam = quiz.mode==='exam';
  v.innerHTML='';
  v.appendChild(el('<div class="progress"><i style="width:' + (quiz.i/quiz.list.length*100) + '%"></i></div>'));
  const card = el('<div class="card">' +
      '<div class="qnum">' + (quiz.i+1) + ' / ' + quiz.list.length +
        (isExam ? '<span class="pill" style="margin-left:6px">채점은 마지막에</span>'
                : '<span class="pill" style="margin-left:6px">' + quiz.correct + '개 맞힘</span>') + '</div>' +
      '<div class="qtext">' + q.q + '</div>' +
      '<div id="chs"></div><div id="exp"></div></div>');
  v.appendChild(card);

  const chs = card.querySelector('#chs');
  q.ch.forEach((c,idx)=>{
    const b = el('<button class="choice">' + (idx+1) + '. ' + esc(c) + '</button>');
    b.onclick = ()=>pick(v, idx, b);
    chs.appendChild(b);
  });
}

function pick(v, idx, btn){
  if(quiz.locked) return;          // 채점은 1회 (규약)
  quiz.locked = true;
  const q = quiz.list[quiz.i];
  const ok = idx === q.a;
  quiz.picks.push({q, pick:idx, ok});
  if(ok) quiz.correct++;
  else   pushWrong(q, idx);

  if(quiz.mode==='exam'){
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    return drawQ(v);
  }

  document.querySelectorAll('.choice').forEach((b,i)=>{
    b.disabled = true;
    if(i===q.a) b.classList.add('correct');
    if(i===idx) b.classList.add('picked', ok?'correct':'wrong');
  });
  try{ if(window.FX) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX', e); }

  const exp = document.querySelector('#exp');
  exp.appendChild(el('<div class="explain"><b>' + (ok?'맞았습니다':'정답은 '+(q.a+1)+'번') + '</b><br>' + esc(q.ex||'') + '</div>'));
  const next = el('<div class="row" style="margin-top:12px">' +
      '<button class="btn btn-primary">' + (quiz.i+1>=quiz.list.length?'결과 보기':'다음 문제 →') + '</button></div>');
  exp.appendChild(next);
  next.querySelector('button').onclick = ()=>{
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    drawQ(v);
  };
}

function pushWrong(q, pk){
  ST.wrong = ST.wrong.filter(w => w.q !== q.q);
  ST.wrong.unshift({ unit:q.unit||'', q:q.q, ch:q.ch, a:q.a, pick:pk, ex:q.ex||'', at:Date.now() });
  ST.wrong = ST.wrong.slice(0, 100);
  save();
}

/* ── 끝난 뒤 ── */
function finish(v){
  const n   = quiz.list.length;
  const pct = Math.round(quiz.correct / n * 100);
  const sec = Math.round((Date.now() - quiz.startTime)/1000);
  const part = quiz.mode==='exam' ? '종합시험' : '연습';

  v.innerHTML = '';
  v.appendChild(el('<div class="card" style="text-align:center">' +
      '<div class="score">' + pct + '점</div>' +
      '<div class="muted">' + n + '문항 중 ' + quiz.correct + '개 정답 · ' +
        Math.floor(sec/60) + '분 ' + (sec%60) + '초</div>' +
      '<div id="rankBox" style="margin-top:12px"></div>' +
      '<div id="rSubmitAnchor" style="margin-top:12px"></div></div>'));

  /* 오답노트 — 종합시험은 여기서 처음으로 정답을 본다 */
  const bad = quiz.picks.filter(p=>!p.ok);
  if(bad.length){
    v.appendChild(el('<div class="card"><h3>📕 틀린 문제</h3></div>'));
    bad.forEach(p=>{
      v.appendChild(el('<div class="card">' +
        '<span class="pill">' + esc(p.q.unit||'') + '</span>' +
        '<div class="qtext">' + p.q.q + '</div>' +
        '<div class="muted">내가 고른 답 : ' + (p.pick+1) + '. ' + esc(p.q.ch[p.pick]) + '</div>' +
        '<div style="color:var(--ok);font-weight:700">정답 : ' + (p.q.a+1) + '. ' + esc(p.q.ch[p.q.a]) + '</div>' +
        '<div class="explain">' + esc(p.q.ex||'') + '</div></div>'));
    });
  }

  /* 제출을 먼저 붙입니다 — 연출·계급에서 오류가 나도 제출 버튼은 살아 있어야 합니다. */
  mountSubmit(pct, quiz.correct, n, sec, part,
              bad.map(p=>({label:(p.q.unit||'') + ' ' + p.q.q.slice(0,24) + '… → 정답 ' + (p.q.a+1) + '번'})));

  try{
    if(window.FX && pct>=60){
      FX.banner({ title: pct>=90?'훌륭합니다!':'통과!', sub: part + ' ' + pct + '점',
                  stars: FX.starsFor ? FX.starsFor(pct) : 0 });
    }
  }catch(e){ console.warn('FX', e); }
  try{
    if(window.Rank){
      const res = Rank.award(pct, { mode:'기계공작법·절삭가공 — ' + part });
      $('#rankBox').innerHTML = Rank.resultBox(res);
    }
  }catch(e){ console.warn('Rank', e); }
}

/* ── 결과 제출 (규약 1) ──
   mode 는 파트마다 다르게, wrong 은 번호가 아니라 "무엇을 틀렸는지" */
function mountSubmit(pct, correct, total, sec, part, bad){
  lastResult = {
    mode   : '기계공작법·절삭가공 — ' + part,
    score  : pct, correct, total,
    wrong  : (bad||[]).map(b=>b.label),
    durationSec : sec,
  };
  const anchor = $('#rSubmitAnchor');
  if(!(window.ResultCollector && ResultCollector.attach) || !anchor) return;
  const btn = ResultCollector.attach(anchor, ()=>lastResult, {
    id:'rcBtn', className:'btn btn-primary',
    mode: lastResult.mode,
    extra: ['기계공작법·절삭가공 ' + part],
  });
  if(btn){ btn.style.width='100%'; btn.textContent = '📤 [' + part + '] 결과 제출'; }
}

/* ── 오답노트 (쌓인 것) ── */
function renderWrong(v){
  if(!ST.wrong.length){
    v.appendChild(el('<div class="empty">🗒️ 아직 오답이 없어요!<br>연습이나 종합시험을 풀면 여기에 모입니다.</div>'));
    return;
  }
  const head = el('<div class="card row"><b>' + ST.wrong.length + '문항</b>' +
      '<button class="btn" id="clrWrong">비우기</button></div>');
  v.appendChild(head);
  $('#clrWrong').onclick = ()=>{ ST.wrong=[]; save(); render('wrong'); };
  ST.wrong.forEach(w=>{
    v.appendChild(el('<div class="card">' +
      '<span class="pill">' + esc(w.unit) + '</span>' +
      '<div class="qtext">' + w.q + '</div>' +
      '<div class="muted">내가 고른 답 : ' + (w.pick+1) + '. ' + esc(w.ch[w.pick]) + '</div>' +
      '<div style="color:var(--ok);font-weight:700">정답 : ' + (w.a+1) + '. ' + esc(w.ch[w.a]) + '</div>' +
      '<div class="explain">' + esc(w.ex) + '</div></div>'));
  });
}

$('#hdSub').textContent = '개념 ' + LEARN.length + ' · 게임 ' + GAMES.length + ' · 문항 ' + QUESTIONS.length;
render('learn');
</script>
